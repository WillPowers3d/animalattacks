name: Daily incident ingest

on:
  schedule:
    - cron: "15 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (do not write)"
        required: false
        default: "false"

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ensure local sqlite (CI fallback)
        run: |
          echo 'DATABASE_URL="file:./dev.db"' >> "$GITHUB_ENV"
          npx prisma db push
          npm run db:seed
        env:
          DATABASE_URL: file:./dev.db
      - name: Ingest news + Facebook stub
        run: npm run ingest${{ github.event.inputs.dry_run == 'true' && ':dry' || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'file:./dev.db' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_IDS: ${{ secrets.FACEBOOK_PAGE_IDS }}
